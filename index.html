<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obst-Schnitt Tipp-Spiel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #E0F7FA 100%);
            min-height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        #game-container {
            position: relative;
            width: 100%; max-width: 800px;
            height: 100vh; max-height: 700px;
            overflow: hidden;
            border: 4px solid #4a90e2;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.2);
            background: linear-gradient(180deg, #ffffff 0%, #f0f8ff 100%);
        }
        #ui-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column;
            padding: 20px;
        }
        #header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
        }
        .stat-box {
            background: rgba(255,255,255,0.9);
            padding: 10px 20px; border-radius: 25px;
            font-size: 1.2rem; font-weight: bold;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 2px solid #4a90e2;
        }
        #score { color: #4CAF50; }
        #lives { color: #f44336; }
        #level { color: #2196F3; }
        #game-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }
        #overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 10; color: white; text-align: center;
        }
        #overlay h1 { font-size: 3rem; margin-bottom: 20px;
            color: #4a90e2; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        #overlay p { font-size: 1.5rem; margin-bottom: 30px; }
        .btn {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white; border: none;
            padding: 15px 40px; font-size: 1.5rem;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }
        #instructions {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            padding: 15px 30px; border-radius: 25px;
            font-size: 1rem; color: #333;
            border: 2px solid #4a90e2; z-index: 5;
        }
        .fruit {
            position: absolute; font-size: 2.5rem;
            cursor: pointer; transition: transform 0.1s;
            user-select: none;
        }
        .fruit::after {
            content: attr(data-letter);
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem; font-weight: bold;
            color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .fruit.cut { animation: cutAnimation 0.3s forwards; }
        @keyframes cutAnimation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3) rotate(10deg); opacity: 0.8; }
            100% { transform: scale(0) rotate(20deg); opacity: 0; }
        }
        .letter-typed {
            position: absolute; color: #4CAF50;
            font-size: 2rem; font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.5s forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }
        @media (max-width: 600px) {
            #game-container { max-width: 100%; height: 100vh; border: none; border-radius: 0; }
            .fruit { font-size: 2rem; }
            #overlay h1 { font-size: 2rem; }
            #overlay p { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div id="header">
                <div class="stat-box">Score: <span id="score">0</span></div>
                <div class="stat-box" id="lives">Leben: ❤️❤️❤️</div>
                <div class="stat-box">Level: <span id="level">1</span></div>
            </div>
            <canvas id="game-canvas"></canvas>
        </div>

        <div id="overlay">
            <h1 id="overlay-title">Spiel vorbei!</h1>
            <p id="overlay-score">Dein Score: 0</p>
            <button class="btn" onclick="resetGame()">Noch einmal spielen</button>
        </div>

        <div id="instructions">
            Tippe den Buchstaben auf dem Obst, um es zu schneiden! 🍎🍌🍊
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
